name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,llm,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test-sqlite:
    name: Tests (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,llm]"
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  test-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: permitpilot
          POSTGRES_PASSWORD: permitpilot
          POSTGRES_DB: permitpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://permitpilot:permitpilot@localhost:5432/permitpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,llm,postgres]"
      - run: pytest

  docker:
    name: Docker image builds and serves /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t permitpilot:ci .
      - name: Smoke test
        run: |
          docker run -d --name pp -p 8000:8000 permitpilot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/api/ordinances | grep -q "Lakeport"
          docker logs pp
