[project]
name = "permitpilot"
version = "0.1.0"
description = "Permit checklists from city ordinances, application workflow tracking, and reminder jobs for small contractors."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "seed/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# A whitespace-separated stopword string reads better than a 40-item list literal.
ignore = ["SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
