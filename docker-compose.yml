# API + worker + PostgreSQL. `docker compose up --build`, then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: permitpilot
      POSTGRES_PASSWORD: permitpilot
      POSTGRES_DB: permitpilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitpilot"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PERMITPILOT_DATABASE_URL: postgresql+psycopg://permitpilot:permitpilot@db:5432/permitpilot
      PERMITPILOT_ANTHROPIC_API_KEY: ${PERMITPILOT_ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker", "--interval", "15"]
    environment:
      PERMITPILOT_DATABASE_URL: postgresql+psycopg://permitpilot:permitpilot@db:5432/permitpilot
      PERMITPILOT_SEED_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
